# Example Klipper macros for K1C auto-farm eject.
# Copy into printer.cfg (or an included file) and tune coordinates for YOUR machine.
# These are starting points — test by hand with FORCE_EJECT before enabling auto-loop.

[gcode_macro FORCE_EJECT]
description: Park, cool slightly, and shove the part off the bed
gcode:
  {% set EJECT_X = printer.configfile.settings.stepper_x.position_max|default(300)|float %}
  {% set EJECT_Y = 5 %}
  {% set PARK_Z = 50 %}
  {% if printer.print_stats.state == "printing" %}
    {action_respond_info("FORCE_EJECT blocked while printing")}
  {% else %}
    G90
    G1 Z{PARK_Z} F600
    G1 X{EJECT_X / 2} Y{EJECT_Y} F6000
    # Optional: cool bed a bit so parts release more cleanly
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=40
    # Sweep / nudge — adjust for your ejector arm or spatula mount
    G1 X5 F3000
    G1 X{EJECT_X - 5} F3000
    G1 X{EJECT_X / 2} Y{EJECT_Y} F6000
    M400
    {action_respond_info("FORCE_EJECT complete — clear bed before next job")}
  {% endif %}


[gcode_macro PRINT_END_AUTO]
description: End-of-print cleanup + auto eject. Call from your slicer end gcode.
gcode:
  # Retract / disable heaters as your stock PRINT_END would
  G91
  G1 E-2 F2700
  G90
  TURN_OFF_HEATERS
  M106 S0
  # Raise and home-ish park before eject
  G1 Z50 F600
  FORCE_EJECT
  # Leave printer idle for the Mac detector to see "complete" then "standby"
  {action_respond_info("PRINT_END_AUTO done")}


# Optional: wrap stock PRINT_END if your config already defines it
# [gcode_macro PRINT_END]
# rename_existing: PRINT_END_BASE
# gcode:
#   PRINT_END_BASE
#   FORCE_EJECT
